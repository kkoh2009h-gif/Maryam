<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd8ef"><title>إلى مريم 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;color:#713d70;overflow-x:hidden;background:radial-gradient(circle at 12% 12%,#ffc5e9 0,transparent 30%),radial-gradient(circle at 90% 20%,#d8c4ff 0,transparent 32%),radial-gradient(circle at 80% 90%,#bceeff 0,transparent 30%),linear-gradient(135deg,#fff0f8,#f1eaff 50%,#e8faff)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 0 3px,transparent 4px),radial-gradient(circle,#ff8dc9a8 0 4px,transparent 5px);background-size:75px 90px,130px 150px}
.wrap{min-height:100vh;display:grid;place-items:center;padding:20px 14px;position:relative}.card{width:min(100%,560px);text-align:center;padding:25px 20px 30px;border:1px solid #fff9;background:#ffffffa8;backdrop-filter:blur(10px);border-radius:32px;box-shadow:0 18px 55px #d77bb82b;position:relative;z-index:1}
.kitty{width:min(62vw,270px);height:auto;display:block;margin:0 auto 2px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 12px 14px #aa7acb40)}
h1{font-size:clamp(29px,7vw,43px);margin:6px 0;color:#e653a4;font-weight:900}p{font-size:18px;line-height:1.9;margin:8px 0 18px}
button{font-family:inherit;border:0;border-radius:999px;padding:13px 30px;font-size:19px;font-weight:900;cursor:pointer;color:white;background:linear-gradient(120deg,#ff79bd,#bd7af2 55%,#77c9f5);box-shadow:0 8px 22px #c17ae545;transition:transform .2s}
button:hover{transform:translateY(-3px)}button:active{transform:scale(.97)}
.hidden{display:none}.message{animation:pop .6s cubic-bezier(.2,1.5,.5,1) both}.final{font-size:clamp(20px,5vw,26px);font-weight:800;line-height:2;color:#d9449b}.name{font-size:clamp(28px,7vw,38px);color:#9a5cdb;text-shadow:0 2px white}
.hint{font-size:13px;color:#b77caa;margin-top:18px}.heart{position:fixed;bottom:-40px;z-index:0;animation:float 7s linear forwards;pointer-events:none}
.bgkitty{position:fixed;width:min(34vw,230px);opacity:.25;z-index:0;pointer-events:none}.left{left:-35px;top:7%;transform:rotate(-12deg)}.right{right:-35px;bottom:3%;transform:rotate(12deg)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}@keyframes pop{from{opacity:0;transform:scale(.7) translateY(12px)}to{opacity:1;transform:scale(1)}}@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media(max-width:420px){.card{padding:20px 14px}.kitty{width:min(68vw,250px)}.bgkitty{width:42vw}}
</style>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,#ffb4d8,transparent 32%),radial-gradient(circle at 90% 18%,#c5b3ff,transparent 30%),linear-gradient(145deg,#301a2b,#4c293e 55%,#2c213a);color:#fff;overflow:hidden}
.wrap{min-height:100vh;display:grid;place-items:center;padding:22px 15px}.panel{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:18px}.art{width:min(86vw,430px);aspect-ratio:1;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #13081270;border:2px solid #f5a5c9}.art svg{width:100%;height:100%;display:block}.caption{background:#100d12;color:#fff;border:2px solid #f18ab6;border-radius:18px;padding:14px 20px;font-size:clamp(18px,5vw,24px);font-weight:900;text-align:center;box-shadow:0 4px 18px #f06ca544;max-width:95%;line-height:1.8}button{border:0;border-radius:999px;padding:14px 34px;background:linear-gradient(120deg,#ff5f9d,#e94e88);color:#fff;font:900 20px Cairo, sans-serif;box-shadow:0 8px 24px #f05b9855;cursor:pointer}button:active{transform:scale(.96)}.heart{position:fixed;bottom:-40px;animation:float 7s linear forwards;pointer-events:none}@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@media(max-width:400px){.panel{gap:14px}.art{width:90vw}.caption{padding:12px 15px}}
</style></head><body><main class="wrap"><section class="panel" aria-live="polite">
<div class="art"><svg id="angela" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="400" rx="28" fill="url(#bg)"/><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffd9e8"/><stop offset="1" stop-color="#f58db8"/></linearGradient></defs><g fill="#f9f5e9" stroke="#4c3031" stroke-width="10" stroke-linejoin="round"><path d="M102 133 82 42Q80 23 101 39l75 62q24-8 48 0l75-62q21-16 19 3l-20 91" /><path d="M93 127Q75 94 103 78q31-18 72-9 28-20 56 0 58-10 73 28 16 44 5 102-14 78-109 86-95-8-109-86-9-39 2-72Z"/></g><path d="M101 111 94 55l54 39M299 111l7-56-54 39" fill="#f7b8d2" stroke="#4c3031" stroke-width="7"/><g fill="#62b9f3" stroke="#4c3031" stroke-width="6"><ellipse cx="153" cy="192" rx="28" ry="39"/><ellipse cx="247" cy="192" rx="28" ry="39"/></g><g fill="#27212a"><ellipse cx="158" cy="199" rx="12" ry="22"/><ellipse cx="252" cy="199" rx="12" ry="22"/></g><g fill="#fff"><circle cx="163" cy="180" r="9"/><circle cx="257" cy="180" r="9"/></g><ellipse cx="200" cy="232" rx="12" ry="9" fill="#f2b44d" stroke="#4c3031" stroke-width="5"/><path d="M188 250q12 15 24 0" fill="none" stroke="#4c3031" stroke-width="5" stroke-linecap="round"/><ellipse cx="119" cy="235" rx="18" ry="10" fill="#f6a5c6"/><ellipse cx="281" cy="235" rx="18" ry="10" fill="#f6a5c6"/><path d="M147 292q53-30 106 0l27 82H120Z" fill="#ed639b" stroke="#4c3031" stroke-width="8"/><path d="M168 291q32 28 64 0" fill="none" stroke="#4c3031" stroke-width="7"/><g transform="translate(272 82) rotate(15)"><path d="M0 25Q-58-30-62 12q-2 35 62 42Q64 47 62 12 58-30 0 25Z" fill="#f35b99" stroke="#4c3031" stroke-width="8"/><circle cy="26" r="20" fill="#ff9ec5" stroke="#4c3031" stroke-width="7"/></g><path d="M130 330q-15 25-4 45M270 330q15 25 4 45" stroke="#4c3031" stroke-width="8" stroke-linecap="round"/></svg></div>
<div id="caption" class="caption">هلو مريم 💗</div>
<button id="action" onclick="step()">هلو</button>
</section></main>
<script>
let s=0;const captions=['هلو مريم 💗','مريم عندي سؤال الحلوة 🥺','بس مستحية أسألج إياه 🙈','مريم يا أحلى ملاك 💖<br>ضحكتج تخلّي الدنيا أحلى<br>وأحب وجودج بحياتي هواي 💗'];
const labels=['هلو','شنو هو؟','اسأليني','أحبج 💕'];
function step(){if(s<3){s++;document.getElementById('caption').innerHTML=captions[s];document.getElementById('action').textContent=labels[s];if(s===3){document.getElementById('action').onclick=hearts;hearts()}}else hearts()}
function hearts(){for(let i=0;i<22;i++){let h=document.createElement('span');h.className='heart';h.textContent=['💗','💕','💖','✨'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'vw';h.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),8500)}}
</script></body></html>
