<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffb7dc">
<title>إلى مريم 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{box-sizing:border-box}
:root{--pink:#ff69ad;--rose:#ffb5d9;--purple:#b77bff}
body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;color:#fff;overflow:hidden;background:radial-gradient(ellipse at 18% 15%,#ff83c5 0,transparent 34%),radial-gradient(ellipse at 85% 22%,#9eeaff 0,transparent 35%),radial-gradient(ellipse at 70% 90%,#ffe48d 0,transparent 35%),linear-gradient(135deg,#f8b9e4,#c9b5ff 48%,#a8eaff)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#ff5ca8 2px,transparent 3px),radial-gradient(#70d9ff 2px,transparent 3px);background-size:42px 42px,97px 97px,137px 137px;background-position:0 0,20px 30px,55px 12px;opacity:.65}
.wrap{min-height:100svh;display:grid;place-items:center;padding:22px 14px;position:relative;z-index:1}
.panel{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.art{width:min(82vw,390px);aspect-ratio:1;border-radius:28px;overflow:hidden;border:3px solid #fff9;box-shadow:0 18px 45px #a43e8460,0 0 0 7px #ffffff25;background:linear-gradient(145deg,#ffc8e6,#f6a6d5);position:relative}
.art:after{content:"♡  ✨  ♡";position:absolute;bottom:12px;left:0;right:0;color:#fff;font-size:24px;text-shadow:0 2px 8px #d24e93;pointer-events:none}
.art img{width:100%;height:100%;object-fit:contain;display:block;padding:8px;filter:drop-shadow(0 8px 12px #a34c7540);animation:pop .5s ease}
.caption{background:linear-gradient(145deg,#fff7fcf2,#ffe5f4f2);color:#a12f72;border:2px solid #fff;border-radius:20px;padding:14px 20px;font-size:clamp(19px,5.2vw,25px);font-weight:900;box-shadow:0 8px 28px #a33c7c35;max-width:95%;line-height:1.8}
button{border:0;border-radius:999px;padding:13px 34px;background:linear-gradient(120deg,#ff4fa2,#bd64ef,#55b9ff);color:white;font:900 20px Cairo,sans-serif;box-shadow:0 8px 24px #d54d9b55;cursor:pointer;transition:transform .15s}button:active{transform:scale(.95)}
.note{font-size:12px;color:#fff;text-shadow:0 1px 5px #87416b}
.heart{position:fixed;bottom:-40px;animation:float 6s linear forwards;pointer-events:none;z-index:3}
@keyframes float{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@media(max-width:380px){.panel{gap:12px}.art{width:88vw}.caption{padding:11px 14px}}
</style></head>
<body><main class="wrap"><section class="panel" aria-live="polite">
<div class="art"><img id="angelaPic" src="baby-angela.webp" alt="Baby Angela" /></div>
<div class="caption" id="caption">هلو مريم 💗</div>
<button id="action" onclick="step()">هلو</button>
<div class="note">رسالة صغيرة من القلب 💌</div>
</section></main>
<script>
const captions=['هلو مريم 💗','مريم عندي سؤال الحلوة 🥺','بس مستحية أسألج إياه 🙈','مريم يا أحلى ملاك 💖<br>ضحكتج تخلّي الدنيا أحلى<br>وأحب وجودج بحياتي هواي 💗'];
const labels=['هلو','شنو هو؟','اسأليني','أحبج 💕'];let s=0;
function step(){if(s<3){s++;document.getElementById('caption').innerHTML=captions[s];document.getElementById('action').textContent=labels[s];if(s===3){document.getElementById('action').onclick=hearts;hearts()}}else hearts()}
function hearts(){for(let i=0;i<28;i++){let h=document.createElement('span');h.className='heart';h.textContent=['💗','💕','💖','✨','🌸'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.animationDuration=(4+Math.random()*4)+'s';h.style.fontSize=(18+Math.random()*22)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),8500)}}
</script></body></html>
