<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd8ef"><title>إلى مريم 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 10% 15%,#ff9fcb,transparent 32%),radial-gradient(circle at 90% 20%,#a78bfa,transparent 30%),linear-gradient(145deg,#2a1829,#573247 55%,#34203b);color:#fff;overflow:hidden}
.wrap{min-height:100vh;display:grid;place-items:center;padding:18px 12px}.panel{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:15px}
.art{width:min(88vw,440px);aspect-ratio:1;border-radius:22px;overflow:hidden;border:2px solid #f7b4d1;box-shadow:0 12px 32px #10061180;background:#ffd6e8}.art img{width:100%;height:100%;object-fit:cover;display:block;animation:appear .45s ease}
.caption{background:#100d12;color:white;border:2px solid #f18ab6;border-radius:17px;padding:12px 18px;font-size:clamp(18px,5vw,24px);font-weight:900;text-align:center;box-shadow:0 4px 18px #f06ca544;max-width:95%;line-height:1.8}
button{border:0;border-radius:999px;padding:13px 34px;background:linear-gradient(120deg,#ff5f9d,#e94e88);color:white;font:900 20px Cairo,sans-serif;box-shadow:0 8px 24px #f05b9855;cursor:pointer}button:active{transform:scale(.96)}
.heart{position:fixed;bottom:-40px;animation:float 7s linear forwards;pointer-events:none}
@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@keyframes appear{from{opacity:.3;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@media(max-width:400px){.panel{gap:12px}.art{width:92vw}.caption{padding:10px 14px}}
</style>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,#ffb4d8,transparent 32%),radial-gradient(circle at 90% 18%,#c5b3ff,transparent 30%),linear-gradient(145deg,#301a2b,#4c293e 55%,#2c213a);color:#fff;overflow:hidden}
.wrap{min-height:100vh;display:grid;place-items:center;padding:22px 15px}.panel{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:18px}.art{width:min(86vw,430px);aspect-ratio:1;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #13081270;border:2px solid #f5a5c9}.art svg{width:100%;height:100%;display:block}.caption{background:#100d12;color:#fff;border:2px solid #f18ab6;border-radius:18px;padding:14px 20px;font-size:clamp(18px,5vw,24px);font-weight:900;text-align:center;box-shadow:0 4px 18px #f06ca544;max-width:95%;line-height:1.8}button{border:0;border-radius:999px;padding:14px 34px;background:linear-gradient(120deg,#ff5f9d,#e94e88);color:#fff;font:900 20px Cairo, sans-serif;box-shadow:0 8px 24px #f05b9855;cursor:pointer}button:active{transform:scale(.96)}.heart{position:fixed;bottom:-40px;animation:float 7s linear forwards;pointer-events:none}@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@media(max-width:400px){.panel{gap:14px}.art{width:90vw}.caption{padding:12px 15px}}
</style></head><body><main class="wrap"><section class="panel" aria-live="polite">
<div class="art"><img id="angelaPic" src="https://games.kidzsearch.com/computer/thumbs/gamemntze-baby-angela-bathing-time-16080-img.png" alt="Baby Angela" onerror="this.onerror=null;this.src='https://www.wallpaperuse.com/wallp/21-213936_talking-angela-wallpaper.jpg';" /></div>
<div class="caption" id="caption">هلو مريم 💗</div><button id="action" onclick="step()">هلو</button>
</section></main>
<script>
const pics=["https://games.kidzsearch.com/computer/thumbs/gamemntze-baby-angela-bathing-time-16080-img.png"];
const captions=['هلو مريم 💗','مريم عندي سؤال الحلوة 🥺','بس مستحية أسألج إياه 🙈','مريم يا أحلى ملاك 💖<br>ضحكتج تخلّي الدنيا أحلى<br>وأحب وجودج بحياتي هواي 💗'];
const labels=['هلو','شنو هو؟','اسأليني','أحبج 💕'];let s=0;
function step(){if(s<3){s++;document.getElementById('angelaPic').src=pics[0];document.getElementById('caption').innerHTML=captions[s];document.getElementById('action').textContent=labels[s];if(s===3){document.getElementById('action').onclick=hearts;hearts()}}else hearts()}
function hearts(){for(let i=0;i<24;i++){let h=document.createElement('span');h.className='heart';h.textContent=['💗','💕','💖','✨'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'vw';h.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),8500)}}
</script></body></html>
